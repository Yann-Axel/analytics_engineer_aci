version: 2

sources:
  - name: raw
    description: "Raw data loaded from the Air Côte d'Ivoire starter Excel dataset."
    tables:
      - name: raw_airports
        description: "10 airports served by Air CI"
      - name: raw_routes
        description: "12 routes (domestic, regional, international)"
      - name: raw_customers
        description: "300 customer profiles with loyalty and segment info"
      - name: raw_flights
        description: "480 flights across January 2025"
      - name: raw_bookings
        description: "11,475 booking transactions"

  - name: synthetic
    description: "Enriched synthetic data generated by scripts/02_generate_synthetic.py"
    tables:
      - name: synth_aircraft_fleet
      - name: synth_fare_details
      - name: synth_loyalty_activity
      - name: synth_customer_reviews
        description: "Unstructured. Post-flight NPS + verbatim text, bilingual fr/en"
      - name: synth_support_tickets
        description: "Unstructured. Complaint logs, route-correlated by operational stress"
      - name: synth_competitor_context

models:
  - name: stg_airports
    description: "Cleaned airport data; ABJ classified as Hub."
    columns:
      - name: airport_code
        description: "IATA code (PK)"
        tests:
          - not_null
          - unique
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: airport_role
        tests:
          - accepted_values:
              arguments:
                values: ['Hub', 'Domestic', 'International']

  - name: stg_routes
    description: "Routes enriched with haul_category and block_time_h."
    columns:
      - name: route_id
        tests:
          - not_null
          - unique
      - name: route_type
        tests:
          - accepted_values:
              arguments:
                values: ['Domestic', 'Regional', 'International']
      - name: haul_category
        tests:
          - accepted_values:
              arguments:
                values: ['Domestic', 'Regional', 'Medium-Haul', 'Long-Haul']
      - name: origin_airport_code
        tests:
          - relationships:
              arguments:
                to: ref('stg_airports')
                field: airport_code
      - name: destination_airport_code
        tests:
          - relationships:
              arguments:
                to: ref('stg_airports')
                field: airport_code

  - name: stg_customers
    description: "Customers with derived age_years, tenure_months, and loyalty_tier_rank (1-4)."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: loyalty_tier
        description: "Explorer / Silver / Gold / Platinum + 'None' for untiered customers."
        tests:
          - accepted_values:
              arguments:
                values: ['None', 'Explorer', 'Silver', 'Gold', 'Platinum']
      - name: loyalty_tier_rank
        description: "0 (None) through 4 (Platinum)."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values: ['Standard', 'Business', 'Budget', 'Premium']

  - name: stg_flights
    description: "Flights with delay_category bucketed (On-Time / Minor / Moderate / Major / Cancelled)."
    columns:
      - name: flight_id
        tests:
          - not_null
          - unique
      - name: route_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: flight_status
        tests:
          - accepted_values:
              arguments:
                values: ['On Time', 'Delayed', 'Cancelled']
      - name: delay_category
        tests:
          - accepted_values:
              arguments:
                values: ['On-Time', 'Minor Delay', 'Moderate Delay', 'Major Delay', 'Cancelled']

  - name: stg_bookings
    description: "Confirmed bookings only; cancelled bookings are filtered out at this layer."
    columns:
      - name: booking_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: flight_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_flights')
                field: flight_id
      - name: fare_class
        tests:
          - accepted_values:
              arguments:
                values: ['Economy', 'Premium Economy', 'Business', 'First']
      - name: has_ancillary
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: stg_reviews
    description: "Customer reviews with NPS category and review_length (unstructured)."
    columns:
      - name: review_id
        tests:
          - not_null
          - unique
      - name: route_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: nps_score
        description: "0-10 NPS score"
        tests:
          - not_null
      - name: nps_category
        tests:
          - accepted_values:
              arguments:
                values: ['Promoter', 'Passive', 'Detractor']
      - name: sentiment
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
      - name: language
        tests:
          - accepted_values:
              arguments:
                values: ['fr', 'en']

  - name: stg_support_tickets
    description: "Support tickets with category, status, ticket_domain (Operational/Commercial/Product)."
    columns:
      - name: ticket_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: route_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: category
        tests:
          - accepted_values:
              arguments:
                values: ['Baggage', 'Flight Delay', 'Customer Service', 'Refund', 'Booking Issue', 'Onboard Experience']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Open', 'Resolved']
      - name: ticket_domain
        tests:
          - accepted_values:
              arguments:
                values: ['Operational', 'Commercial', 'Product']

  - name: stg_loyalty
    description: "Loyalty point events with earn/redeem flags."
    columns:
      - name: activity_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: tier_after
        tests:
          - accepted_values:
              arguments:
                values: ['Bronze', 'Silver', 'Gold', 'Platinum']
